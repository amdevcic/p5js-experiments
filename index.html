<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.js"></script>
    <script>
      function restartSketch() {
        remove();
        new p5();
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: rgb(86, 97, 107);
      }
      #canvas-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 12px; /* space between canvas and button */
      }
      #canvas-container canvas {
        max-width: 100vw !important;
        height: auto !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <div id="buttons" style="order: 1">
        <button onclick="noLoop()">Pause</button>
        <button onclick="loop()">Play</button>
        <button onclick="restartSketch()">Restart</button>
        <button onclick="saveCanvas()">Save image</button>
      </div>
    </div>
    <script src="7-tiles/sketch_v2.js"></script>
  </body>
</html>
