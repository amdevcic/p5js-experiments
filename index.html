<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300&display=swap" 
      rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.js"></script>
    <script>
      function restartSketch() {
        remove();
        new p5();
      }

      function changeSketch(step) {
        const sketchSelect = document.getElementById("sketch-select");
        sketchSelect.selectedIndex += step;
        sketchSelect.dispatchEvent(new Event("change"));
      }
    </script>
  </head>
  <body>
    <div id="canvas-container">
      <div class="buttons">
        <button
          id="previous-sketch"
          type="button"
          aria-label="Previous sketch"
          title="Previous sketch"
          onclick="changeSketch(-1)"
        >&larr;</button>
        <select id="sketch-select" aria-label="Select sketch"></select>
        <button
          id="next-sketch"
          type="button"
          aria-label="Next sketch"
          title="Next sketch"
          onclick="changeSketch(1)"
        >&rarr;</button>
      </div>
      <div class="buttons" id="buttons" style="order: 1">
        <button onclick="noLoop()">Pause</button>
        <button onclick="loop()">Play</button>
        <button onclick="restartSketch()">Restart</button>
        <button onclick="saveCanvas()">Save image</button>
      </div>
    </div>
    <script src="loader.js"></script>
  </body>
</html>
